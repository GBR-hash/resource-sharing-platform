server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/example_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# 文件存储配置
file:
  upload-dir: ./uploads
  resource-dir: ./resources

# JWT配置
jwt:
  secret: resource-sharing-platform-secret-key-2024
  expiration: 86400000
  token-prefix: Bearer

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,env,info,prometheus,threaddump,heapdump,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

# 运维 Token 配置
ops:
  token: ops-secret-token-2024

# 日志配置
logging:
  level:
    com.example.resourcesharingplatform: DEBUG
    org.springframework.security: INFO
  file:
    name: ./logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30