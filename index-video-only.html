<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pi Monitor</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Mono",Menlo,monospace;background:#0d1117;color:#c9d1d9;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom,12px)}
.stream-wrap{width:100%;background:#000;line-height:0;position:relative;min-height:30dvh}
.stream-wrap img{width:100%;display:block;object-fit:contain;max-height:72dvh}
.no-cam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#161b22;opacity:1;transition:opacity 0.3s}
.no-cam.hidden{opacity:0;pointer-events:none}
.no-cam svg{width:40px;height:40px;color:#484f58;margin-bottom:8px}
.no-cam span{font-size:13px;color:#484f58}
.fps{position:absolute;top:6px;left:6px;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:4px 8px;border-radius:5px;pointer-events:none}
.fps-dot{width:6px;height:6px;border-radius:50%;background:#3fb950;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.fps-num{font-size:12px;font-weight:600;color:#e6edf3;font-variant-numeric:tabular-nums}
.fps-unit{font-size:10px;color:#8b949e;font-weight:400}
</style>
</head>
<body>
<div class="stream-wrap">
<img id="stream" alt="Camera Stream" style="display:none">
<div class="no-cam" id="no_cam"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/><line x1="1" y1="1" x2="23" y2="23"/></svg><span>未接入摄像头</span></div>
<div class="fps"><span class="fps-dot"></span><span class="fps-num" id="fps_num">--</span><span class="fps-unit">fps</span></div>
</div>
<script>
var B="/monitor",U=B+"/frame.jpg",I=document.getElementById("stream"),N=document.getElementById("fps_num"),NC=document.getElementById("no_cam");
var T=[],C=3,P=0,R=0,active=false,timer=null;

function tic(){var n=performance.now();T.push(n);while(T.length&&n-T[0]>3000)T.shift();if(T.length>1)N.textContent=((T.length-1)/((n-T[0])/1000)).toFixed(1)}

function fir(){
if(!active||P>=C)return;
P++;
fetch(U+"?_="+Date.now()).then(function(r){
if(!r.ok){P--;setTimeout(fir,50);return null}
return r.blob()
}).then(function(b){
if(!b)return;
P--;
var n=performance.now();
if(n>R){R=n;var u=URL.createObjectURL(b),o=I.src;I.src=u;if(o&&o.startsWith("blob:"))URL.revokeObjectURL(o);tic()}
fir()
}).catch(function(){P--;setTimeout(fir,50)})
}

function startFetch(){if(!active){active=true;P=0;for(var i=0;i<C;i++)fir()}}
function stopFetch(){active=false}

function checkCam(){
fetch(B+"/api/camera-status").then(function(r){return r.json()}).then(function(d){
if(d.available){
NC.classList.add("hidden");
I.style.display="block";
startFetch();
}else{
NC.classList.remove("hidden");
I.style.display="none";
stopFetch();
N.textContent="--";
}
}).catch(function(){})
}
checkCam();
timer=setInterval(checkCam,2000);
</script>
</body>
</html>
