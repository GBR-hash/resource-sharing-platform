<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pi Monitor</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Mono",Menlo,monospace;background:#0d1117;color:#c9d1d9;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom,12px)}
.stream-wrap{width:100%;background:#000;line-height:0;position:relative}
.stream-wrap img{width:100%;display:block;object-fit:contain;max-height:50dvh}
.fps{position:absolute;top:6px;left:6px;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:4px 8px;border-radius:5px;pointer-events:none}
.fps-dot{width:6px;height:6px;border-radius:50%;background:#3fb950;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.fps-num{font-size:12px;font-weight:600;color:#e6edf3;font-variant-numeric:tabular-nums}
.fps-unit{font-size:10px;color:#8b949e;font-weight:400}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.card{background:#161b22;border:1px solid #21262d;border-radius:6px;padding:12px 10px;display:flex;flex-direction:column;gap:4px}
.card .label{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:0.5px}
.card .value{font-size:22px;font-weight:600;color:#58a6ff}
.card .bar-wrap{height:3px;background:#21262d;border-radius:2px;margin-top:2px;overflow:hidden}
.card .bar-fill{height:100%;border-radius:2px;transition:width .6s ease}
.bar-cpu{background:#f78166}.bar-temp{background:#f0883e}.bar-mem{background:#d2a8ff}.bar-disk{background:#7ee787}
.card .detail{font-size:10px;color:#6e7681;margin-top:1px}
</style>
</head>
<body>
<div class="stream-wrap">
<img id="stream" alt="Camera Stream">
<div class="fps"><span class="fps-dot"></span><span class="fps-num" id="fps_num">--</span><span class="fps-unit">fps</span></div>
</div>
<div class="cards">
<div class="card"><span class="label">CPU</span><span class="value" id="cpu_val">--</span><span class="detail" id="cpu_temp">--</span><div class="bar-wrap"><div class="bar-fill bar-cpu" id="cpu_bar" style="width:0%"></div></div></div>
<div class="card"><span class="label">TEMP</span><span class="value" id="temp_val">--</span><span class="detail"> C</span><div class="bar-wrap"><div class="bar-fill bar-temp" id="temp_bar" style="width:0%"></div></div></div>
<div class="card"><span class="label">MEMORY</span><span class="value" id="mem_val">--</span><span class="detail" id="mem_detail">-- / -- GB</span><div class="bar-wrap"><div class="bar-fill bar-mem" id="mem_bar" style="width:0%"></div></div></div>
<div class="card"><span class="label">DISK SD</span><span class="value" id="disk_root_val">--</span><span class="detail">/</span><div class="bar-wrap"><div class="bar-fill bar-disk" id="disk_root_bar" style="width:0%"></div></div></div>
<div class="card"><span class="label">DISK NVMe</span><span class="value" id="disk_nvme_val">--</span><span class="detail">/mnt/nvme</span><div class="bar-wrap"><div class="bar-fill bar-disk" id="disk_nvme_bar" style="width:0%"></div></div></div>
<div class="card"><span class="label">UPTIME</span><span class="value" id="uptime_val">--</span><span class="detail" id="uptime_detail"></span></div>
</div>
<script>
var B="/monitor",U=B+"/frame.jpg",I=document.getElementById("stream"),N=document.getElementById("fps_num");
var T=[],C=3,P=0,R=0;
function tic(){var n=performance.now();T.push(n);while(T.length&&n-T[0]>3000)T.shift();if(T.length>1)N.textContent=((T.length-1)/((n-T[0])/1000)).toFixed(1)}
function fir(){
if(P>=C)return;
P++;
fetch(U+"?_="+Date.now()).then(function(r){
if(!r.ok){P--;setTimeout(fir,50);return null}
return r.blob()
}).then(function(b){
if(!b)return;
P--;
var n=performance.now();
if(n>R){R=n;var u=URL.createObjectURL(b),o=I.src;I.src=u;if(o&&o.startsWith("blob:"))URL.revokeObjectURL(o);tic()}
fir()
}).catch(function(){P--;setTimeout(fir,50)})
}
for(var i=0;i<C;i++)fir();
function fu(s){var d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);return d>0?d+"d "+h+"h":h>0?h+"h "+m+"m":m+"m"}
function cl(v){return Math.max(0,Math.min(100,v))}
function up(){fetch(B+"/api/stats").then(function(r){return r.json()}).then(function(d){document.getElementById("cpu_val").textContent=d.cpu_percent+"%";document.getElementById("cpu_bar").style.width=cl(d.cpu_percent)+"%";document.getElementById("temp_val").textContent=d.cpu_temp+"°C";document.getElementById("temp_bar").style.width=cl((d.cpu_temp/85)*100)+"%";document.getElementById("mem_val").textContent=d.memory_percent+"%";document.getElementById("mem_detail").textContent=d.memory_used_gb+" / "+d.memory_total_gb+" GB";document.getElementById("mem_bar").style.width=cl(d.memory_percent)+"%";document.getElementById("disk_root_val").textContent=d.disk_root_percent+"%";document.getElementById("disk_root_bar").style.width=cl(d.disk_root_percent)+"%";document.getElementById("disk_nvme_val").textContent=d.disk_nvme_percent+"%";document.getElementById("disk_nvme_bar").style.width=cl(d.disk_nvme_percent)+"%";document.getElementById("uptime_val").textContent=fu(d.uptime_seconds)}).catch(function(){})}
up();setInterval(up,2000);
</script>
</body>
</html>
